# Generated by: cc plan ./my-project
# Dispatch with: cc dispatch cc-manifest.yml
#
# Layout on disk after dispatch:
#   ~/code/
#     my-project/                          # the repo
#     cc-manifest.yml                      # this file
#     my-project--feat-add-widget/         # worktree
#     my-project--feat-fix-auth-refresh/   # worktree
#     my-project--feat-add-csv-export/     # worktree
#     my-project--_logs/                   # agent logs

repo: /src/my-project
base: main

# Optional: extra read-only mounts available to all agents
# mounts:
#   - src: /src/reference-codebase    # host path (or /src-relative container path)
#     dst: /ref                        # where it appears inside each container
#   - src: ~/data/shared-fixtures
#     dst: /fixtures

features:
  - branch: feat/add-widget
    prompt: |
      Implement the Widget component. Follow the existing patterns in
      src/components/ (see Button.tsx for the standard structure).
      It should accept a title (string) and children (ReactNode) props,
      render a card-style wrapper with a header and body section.
      Add unit tests in src/components/__tests__/Widget.test.tsx.
      Use the existing test patterns from Button.test.tsx.

  - branch: feat/fix-auth-refresh
    prompt: |
      Fix the auth token refresh bug in src/auth/client.ts.
      When the access token expires, the refresh request on line 47
      is missing the Authorization header with the refresh token.
      Add `Authorization: Bearer ${refreshToken}` to the refresh
      request headers. Add a test in src/auth/__tests__/client.test.ts
      that verifies the header is sent during token refresh.

  - branch: feat/add-csv-export
    prompt: |
      Add CSV export to the reports page. The data is already fetched
      in src/reports/ReportsTable.tsx via useReportsData().
      Add a "Download CSV" button above the table that converts
      the current data to CSV format and triggers a browser download.
      Put the CSV conversion logic in src/reports/exportCsv.ts.
      Add unit tests for the conversion function.
